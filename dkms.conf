PACKAGE_NAME="ntfsplus"
PACKAGE_VERSION="@PKGVER@"
BUILT_MODULE_NAME[0]="ntfsplus"
DEST_MODULE_LOCATION[0]="/kernel/fs/ntfsplus"
MAKE[0]="make KVER=${kernelver} -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build M=\$PWD"
CLEAN="make clean"
AUTOINSTALL="yes"
REMAKE_INITRD="no"

# Kernel version compatibility
# Supported kernels: 6.12, 6.13, 6.14, 6.15, 6.16, 6.17, 6.18
BUILD_EXCLUSIVE_KERNEL="^6\.(1[2-8])\.*"

# Post-install script to handle compatibility
POST_INSTALL="ntfsplus-dkms-postinstall.sh"

# Module dependencies
DEPENDS=""

# Module signing (optional)
# SIGN_TOOL="/usr/bin/kmodsign"
# SIGN_HASH="sha512"
# SIGN_PRIVKEY="/path/to/private.key"
# SIGN_CERT="/path/to/certificate.pem"